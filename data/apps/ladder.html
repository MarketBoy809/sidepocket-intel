<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dip ladder</title>
<style>
:root{
  --bg:#EFF2F6;--surface:#FFFFFF;--surface2:#F6F8FB;--line:#DCE2EB;--line2:#E9EDF3;
  --ink:#131821;--ink2:#525D6D;--ink3:#8A94A3;--accent:#D9820A;--up:#13985E;
  --mono:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1016;--surface:#141A23;--surface2:#1A212C;--line:#262F3D;--line2:#1D2531;
  --ink:#E9EEF5;--ink2:#9BA6B6;--ink3:#6B7688;--accent:#F5A23E;--up:#3FD68D;
}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
     font:14px/1.45 Roboto,system-ui,sans-serif}
h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);
      background:var(--surface2);color:inherit;font-family:var(--mono);font-size:14px;width:100%}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--ink3);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line2)}
td{padding:8px 4px;border-bottom:1px solid var(--line2);font-family:var(--mono)}
td.n,th.n{text-align:right}
.tot{color:var(--accent);font-weight:700}
.note{font-size:12px;color:var(--ink3);line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="card">
  <h2>Your ladder</h2>
  <div class="form">
    <label>Recent high ($)<input id="hi" type="number" inputmode="decimal" value="90000"></label>
    <label>Pot in stables ($)<input id="pot" type="number" inputmode="decimal" value="1000"></label>
    <label>Take profit (%)<input id="tp" type="number" step="0.1" value="1.5"></label>
    <label>Fee per trade (%)<input id="fee" type="number" step="0.01" value="0.2"></label>
  </div>
</div>

<div class="card">
  <h2>Buy levels</h2>
  <table>
    <thead><tr><th>Fall</th><th class="n">Buy at</th><th class="n">Slice</th>
      <th class="n">Break even</th><th class="n">Sell at</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="note" id="summary" style="margin-top:10px"></p>
</div>

<div class="card">
  <p class="note">Break-even covers both the buy and the sell fee. "Sell at" adds your take-profit
  on top of break-even, so the percentage you set is what you actually keep.
  Figures are arithmetic, not advice.</p>
</div>

<script>
var LADDER = [[4, 5], [8, 10], [12, 15], [18, 25]];  // % fall from high -> % of remaining pot

function num(id) { var v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : 0; }
function money(v) { return v >= 1000 ? v.toLocaleString(undefined, {maximumFractionDigits: 0})
                                     : v.toFixed(v < 10 ? 4 : 2); }

function render() {
  var hi = num("hi"), pot = num("pot"), tp = num("tp") / 100, fee = num("fee") / 100;
  var left = pot, spent = 0, coins = 0, out = "";
  LADDER.forEach(function (row) {
    var fall = row[0], share = row[1] / 100;
    var price = hi * (1 - fall / 100);
    var slice = left * share;
    left -= slice;
    if (price > 0) { coins += (slice * (1 - fee)) / price; spent += slice; }
    // break even must cover the fee paid on the way in and the one on the way out
    var be = price * (1 + fee) / (1 - fee);
    var sell = be * (1 + tp);
    out += "<tr><td>-" + fall + "%</td><td class=n>" + money(price) + "</td><td class=n>$"
         + money(slice) + "</td><td class=n>" + money(be) + "</td><td class='n tot'>"
         + money(sell) + "</td></tr>";
  });
  document.getElementById("rows").innerHTML = out;
  var avg = coins > 0 ? spent / coins : 0;
  document.getElementById("summary").textContent = spent > 0
    ? "All four levels filled: $" + money(spent) + " deployed, $" + money(left)
      + " still in stables, average entry " + money(avg) + "."
    : "Enter a recent high to see your levels.";
}

["hi", "pot", "tp", "fee"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", render);
});
render();
</script>
</body>
</html>
